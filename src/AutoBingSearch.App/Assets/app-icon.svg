<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AutoBingSearch icon</title>
  <desc id="desc">A quartz search lens with a Bing-style green accent and motion mark.</desc>
  <defs>
    <linearGradient id="bg" x1="46" y1="28" x2="216" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8faf8"/>
      <stop offset=".56" stop-color="#d9dedb"/>
      <stop offset="1" stop-color="#aeb7b2"/>
    </linearGradient>
    <linearGradient id="ring" x1="62" y1="48" x2="179" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
